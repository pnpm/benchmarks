name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
